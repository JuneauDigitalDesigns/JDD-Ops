# Correctness gate for the provisioning path.
#
# This repo is never deployed and holds master credentials, so CI deliberately has NO secrets.
# Everything below is hermetic: the root suite replays recorded vendor payloads from
# test/fixtures/, and the vendor-facing predicates return `null` ("could not check") when
# credentials are absent rather than passing or failing. Live verification stays manual, in
# `npm run verify-make` / `verify-post-call`, which an operator runs before a real run.
name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: the test runner is invoked with a glob, which needs >= 21. The console suite
      # already uses the same form.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci` needs a lockfile that matches package.json; the root install also pulls
      # @jdd/schema straight from GitHub, which is public-read for this org.
      - name: Install (root)
        run: npm ci

      - name: Root suite — onboard.js + lib/
        run: npm test

      - name: Install (console)
        working-directory: console
        run: npm ci

      - name: Console suite
        working-directory: console
        run: npm test

      # Fails if a recorded dry run no longer matches what onboard.js emits. This is the guard
      # run-plan.ts's header asks for: add or reorder a log() call without updating PHASE_MAP
      # and expectedPhases, and the UI silently mis-narrates every run. Needs no credentials —
      # a dry run creates nothing and the phase SEQUENCE does not depend on them.
      - name: Dry-run phase contract is current
        run: npm run fixtures:dry-run:check
